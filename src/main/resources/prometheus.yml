global:
  scrape_interval: 15s  # Как часто собирать метрики

scrape_configs:
  - job_name: 'star-application'  # Имя вашего приложения в Prometheus
    metrics_path: '/actuator/prometheus'  # Эндпоинт, который предоставляет метрики
    static_configs:
      - targets: ['host.docker.internal:8080']  # АДРЕС И ПОРТ ВАШЕГО ЗАПУЩЕННОГО ПРИЛОЖЕНИЯ STAR