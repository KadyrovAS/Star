# Включение необходимых эндпоинтов Actuator
management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus, metrics  # "prometheus" - ключевой эндпоинт
      base-path: /actuator  # (Опционально) Базовый путь для эндпоинтов
  metrics:
    export:
      prometheus:
        enabled: true  # Включаем экспорт в формат Prometheus

# Конфигурация вашего кастомного стартера
method:
  metrics:
    enabled: true                # Включить сбор метрик
    prefix: "star.method"        # Префикс для названий ваших метрик (например, star.method.calls.total)
    histogram: true              # Включить детальную гистограмму времени выполнения
    percentiles: [0.5, 0.95, 0.99]  # Какие процентили вычислять (медиана, 95й, 99й)